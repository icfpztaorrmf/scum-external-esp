    <path d="M128 182 L128 238 L132 228 L128 220" stroke="#ff5a1f"/>
    <path d="M18 128 L58 128 L66 124 L74 128" />
    <path d="M182 128 L238 128 L228 132 L220 128" stroke="#ff5a1f"/>
  </g>

  <!-- Cracked reticle center: sharp diamond + stress fractures -->
  <polygon points="128,104 150,128 128,152 106,128" fill="none" stroke="#7CFF4F" stroke-width="3"/>
  <g stroke="#7CFF4F" stroke-width="2" fill="none">
    <path d="M128 104 L128 86 L122 78"/>
    <path d="M128 152 L128 170 L134 178"/>
    <path d="M106 128 L88 128 L80 122"/>
    <path d="M150 128 L168 128 L176 134"/>
    <path d="M118 118 L104 104"/>
    <path d="M138 138 L152 152"/>
    <path d="M138 118 L152 104"/>
    <path d="M118 138 L104 152"/>
  </g>
  <!-- Impact crack fragments -->
  <g stroke="#ff5a1f" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M116 116 L108 108 L112 100"/>
    <path d="M140 140 L148 148 L144 156"/>
    <path d="M140 116 L148 108 L152 116"/>
    <path d="M116 140 L108 148 L112 156"/>
  </g>

  <!-- Human skull silhouette fused behind reticle -->
  <g fill="#c9d6b8">
    <path d="M128 64
             C 96 64 78 82 78 110
             C 78 124 82 134 90 142
             L 88 156 L 96 154 L 96 168
             L 108 168 L 110 156
             L 118 158 L 118 170
             L 138 170 L 138 158
             L 146 156 L 148 168
             L 160 168 L 160 154
             L 168 156 L 166 142
             C 174 134 178 124 178 110
             C 178 82 160 64 128 64 Z"
          fill-opacity="0.92"/>
  </g>
  <!-- Skull cutouts: eyes, nose, jaw fracture -->
  <g fill="#0b0f0a">
    <polygon points="100,104 118,104 116,122 108,126 98,118"/>
    <polygon points="138,104 156,104 158,118 148,126 140,122"/>
    <polygon points="124,132 132,132 134,144 126,146"/>
    <!-- Jaw fracture -->
    <path d="M114 160 L120 150 L126 162 L132 150 L138 162 L144 152 L150 160 L146 170 L118 170 Z"/>
  </g>
  <!-- Skull striations for stencil wear -->
  <g stroke="#0b0f0a" stroke-width="1.5" fill="none" stroke-opacity="0.65">
    <path d="M92 92 L102 96"/>
    <path d="M154 92 L164 96"/>
    <path d="M86 116 L94 118"/>
    <path d="M162 116 L170 118"/>
    <path d="M122 72 L124 84"/>
    <path d="M134 72 L132 84"/>
  </g>

  <!-- Tactical stencil-style glyph accents (utilitarian notches) -->
  <g fill="#7CFF4F">
    <polygon points="128,36 132,44 128,52 124,44"/>
    <polygon points="36,128 44,132 52,128 44,124" fill="#ff5a1f"/>
    <polygon points="220,128 212,132 204,128 212,124"/>
    <rect x="120" y="224" width="16" height="4"/>
  </g>

  <!-- Small wordmark, optional, bottom-left, stencil mono feel -->
  <text x="30" y="244" font-family="monospace" font-size="9" letter-spacing="2" fill="#c9d6b8" opacity="0.75">SCUM // ESP 2026</text>
  <rect x="30" y="246" width="52" height="2" fill="#ff5a1f" opacity="0.8"/>
</svg>
