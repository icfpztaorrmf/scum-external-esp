<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0b0f0a"/>
  <!-- Outer tactical HUD frame segments (off-center, cropped composition) -->
  <path d="M28 36 L36 24 L72 24 L80 32" fill="none" stroke="#c9d6b8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M228 36 L220 24 L184 24 L176 32" fill="none" stroke="#c9d6b8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M28 220 L36 232 L72 232 L80 224" fill="none" stroke="#c9d6b8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M228 220 L220 232 L184 232 L176 224" fill="none" stroke="#ff5a1f" stroke-width="4" stroke-linejoin="round"/>

  <!-- Distressed cracked target ring (ballistic crosshair) -->
