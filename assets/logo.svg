    <circle cx="128" cy="128" r="62" stroke-dasharray="22 6 44 8 30 6 18 6" stroke="#7CFF4F" stroke-opacity="0.55"/>
  </g>

  <!-- Crosshair ticks with jagged ballistic breaks -->
